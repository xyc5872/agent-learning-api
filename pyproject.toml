[project]
name = "agent-learning-api"
version = "0.1.0"
description = "Minimal FastAPI service for agent learning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pymysql>=1.2.3",
    "sqlalchemy>=2,<3",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
